name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip dosyasını aç
        run: unzip -o TurboBooster-Android.zip

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Debug APK derle
        working-directory: TurboBooster
        run: gradle assembleDebug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: TurboBooster-debug-apk
          path: TurboBooster/app/build/outputs/apk/debug/app-debug.apk
